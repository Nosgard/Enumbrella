# Secret and personal-data rules for every repository.
# Default gitleaks rules plus file-name rules, extra secret rules and
# personal-data rules (email, phone, IBAN, postal address).
# Test data uses example.com / .test / .invalid addresses, phone numbers
# with only zeros after the area code and the IBAN DE00 0000 0000 0000 0000 00.

title = "repository secrets and personal data"

[extend]
useDefault = true

[[allowlists]]
description = "Known lockfiles and this config at the repository root"
paths = [
  '''(^|[\\/])(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock|poetry\.lock|composer\.lock|Gemfile\.lock)$''',
  '''^\.gitleaks(\.toml|ignore)$''',
]

# ---------------------------------------------------------------- file names

[[rules]]
id = "file-dotenv"
description = "Environment file with real values"
path = '''(^|[\\/])(\.env(\.[^\\/]+)?|[^\\/]+\.env|\.envrc)$'''
[[rules.allowlists]]
paths = ['''\.env\.(example|sample|template)$''']

[[rules]]
id = "file-private-key"
description = "Private key or certificate store"
path = '''(^|[\\/])(id_(rsa|dsa|ecdsa|ed25519)[^\\/]*|[^\\/]+\.(pem|key|p12|pfx|jks|keystore|ppk))$'''
[[rules.allowlists]]
paths = ['''(^|[\\/])id_[a-z0-9]+\.pub$''']

[[rules]]
id = "file-credentials"
description = "Credential or token file"
path = '''(^|[\\/])(credentials[^\\/]*\.json|service[-_]?account[^\\/]*\.json|\.npmrc|\.pypirc|\.netrc|\.htpasswd|\.git-credentials)$'''

[[rules]]
id = "file-data-dump"
description = "Database, dump or state file"
path = '''(^|[\\/])[^\\/]+\.(sqlite[0-9]?|sqlite-(wal|shm)|db|dump|bak|tfstate(\.backup)?)$'''

# -------------------------------------------------------------- extra secrets

[[rules]]
id = "url-with-credentials"
description = "Connection URL with user and password"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@'"`<>]+:([^\s:/@'"`<>]{3,})@[^\s/'"`<>]+'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''://[^:]*:(password|passwd|pass|pw|secret|changeme|change-me|example|placeholder|dummy|test|xxx+|\*+)@''',
  '''://[^:]*:(\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|<[^>]*>|\{[^}]*\}|%[a-z_()]+s?)@''',
]

[[rules]]
id = "unquoted-secret-assignment"
description = "Secret assigned without quotes in env, YAML or INI style files"
regex = '''(?i)\b[a-z0-9_.-]*(password|passwd|secret|token|api[_-]?key|private[_-]?key|access[_-]?key|client[_-]?secret|auth)[a-z0-9_.-]*\s*[=:]\s*([^\s'"#`]{8,})'''
secretGroup = 2
keywords = ["pass", "secret", "token", "key", "auth"]
path = '''(^|[\\/])(\.env[^\\/]*|[^\\/]+\.(env|ya?ml|ini|cfg|conf|properties|toml))$'''
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^(\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|<[^>]*>|\{\{[^}]*\}\}|%\([^)]*\)s)''',
  '''(?i)(changeme|change[-_]me|your[-_]|example|placeholder|dummy|replace[-_]?me|xxx|\*\*\*|todo|none|null|true|false)''',
  '''^(secrets|vars|env|steps|needs|github|inputs|matrix)\.''',
]

[[rules]]
id = "firecrawl-api-key"
description = "Firecrawl API key"
regex = '''\bfc-[a-f0-9]{32}\b'''
keywords = ["fc-"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''\btvly-[A-Za-z0-9-]{20,}\b'''
keywords = ["tvly-"]

# ------------------------------------------------------------ personal data

[[rules]]
id = "pii-email"
description = "Real email address"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}\b'''
keywords = ["@"]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)@([a-z0-9-]+\.)*example(\.(com|org|net))?$''',
  '''(?i)@([a-z0-9-]+\.)*[a-z0-9-]+\.(test|invalid|localhost|local|example)$''',
  '''(?i)@users\.noreply\.github\.com$''',
  '''(?i)^noreply@anthropic\.com$''',
  '''(?i)^(git|hg|ssh)@[a-z0-9.-]+$''',
  '''(?i)@\d+(\.\d+)?x\.(png|jpe?g|webp|avif|gif|svg)$''',
  '''(?i)\.(png|jpe?g|webp|avif|gif|svg|js|mjs|cjs|ts|css|json|vue|tsx|jsx)$''',
]

[[rules]]
id = "pii-phone"
description = "Real phone number"
regex = '''(?:^|[^\w+])((?:\+[1-9]\d{0,2}|00[1-9]\d{0,2})[ ./-]?(?:\(0\)[ ./-]?)?[1-9]\d{1,4}[ ./-]?\d{3,9}(?:[ ./-]?\d{1,6})?|0[1-9]\d{1,4}[ /-]\d{3,9}(?:[ -]\d{1,6})?)(?:$|[^\w])'''
secretGroup = 1
keywords = ["+", "0"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^(\+|00)\d{1,3}[ ./-]?(\(0\)[ ./-]?)?\d{2,5}[ ./-]?0+([ ./-]?0+)?$''',
  '''^0\d{2,5}[ /-]0+([ -]0+)?$''',
  '''^(\+|00)?[0 ./()-]+$''',
]

[[rules]]
id = "pii-iban"
description = "Real IBAN"
regex = '''\b((?:DE|AT|CH|LI|LU|NL|BE|FR|IT|ES|PT|IE|GB|DK|SE|NO|FI|PL|CZ|SK|HU|SI|HR)\d{2}(?: ?[A-Z0-9]{4}){3,7}(?: ?[A-Z0-9]{1,3})?)\b'''
secretGroup = 1
keywords = ["de", "at", "ch", "li", "lu", "nl", "be", "fr", "it", "es", "pt", "ie", "gb", "dk", "se", "no", "fi", "pl", "cz", "sk", "hu", "si", "hr"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^[A-Z]{2}00( ?0{4})+( ?0{1,3})?$''']

[[rules]]
id = "pii-postal-address"
description = "Real German postal address"
regex = '''\b([A-ZÄÖÜ][a-zäöüß-]+(?:straße|strasse|str\.|weg|gasse|allee|platz|ring|damm|ufer|chaussee)\s+\d{1,4}\s?[a-zA-Z]?)\b|,\s*(\d{5}\s+[A-ZÄÖÜ][a-zäöüß]{2,})\b'''
keywords = ["str", "weg", "gasse", "allee", "platz", "ring", "damm", "ufer", "chaussee", ","]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)(muster|beispiel|example|test)''', ''',\s*00000\s''']
